<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Oni Maskesi AR - Direct Three.js</title>

    <!-- Doğrudan Kararlı Three.js ve MindAR Face ThreeJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-three.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: sans-serif;
      }
      #container {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }
      #log-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 110px;
        background: rgba(0, 0, 0, 0.85);
        color: #00ff66;
        font-family: monospace;
        font-size: 12px;
        padding: 10px;
        box-sizing: border-box;
        overflow-y: scroll;
        z-index: 999999;
        border-top: 2px solid #00ff66;
      }
    </style>

    <script>
      function log(msg, color = "#00ff66") {
        const panel = document.getElementById("log-panel");
        if (panel) {
          const line = document.createElement("div");
          line.style.color = color;
          line.innerText = `> ${msg}`;
          panel.appendChild(line);
          panel.scrollTop = panel.scrollHeight;
        }
      }
    </script>
  </head>
  <body>
    <div id="container"></div>
    <div id="log-panel">Sistem başlatılıyor...</div>

    <script>
      const container = document.getElementById("container");

      async function initAR() {
        try {
          log("MindAR Face başlatılıyor...");

          // MindAR ThreeJS Motoru
          const mindarThree = new window.MINDAR.FACE.MindARThree({
            container: container,
          });

          const { renderer, scene, camera } = mindarThree;

          // Sahne Işıkları
          const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
          scene.add(ambientLight);

          const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
          dirLight.position.set(0, 1, 1);
          scene.add(dirLight);

          // anchorIndex 168 (Burun kökü / alın ortası)
          const anchor = mindarThree.addAnchor(168);

          // 1. TEST KÜRESİ (Yüz takibi anında görünmesi için)
          const testSphereGeo = new THREE.SphereGeometry(0.08, 16, 16);
          const testSphereMat = new THREE.MeshBasicMaterial({
            color: 0xffff00,
          });
          const testSphere = new THREE.Mesh(testSphereGeo, testSphereMat);
          testSphere.position.set(0, -0.05, 0.1);
          anchor.group.add(testSphere);

          // 2. ONI MASKESİNİ YÜKLE
          log("oni_mask.glb yükleniyor (9.3 MB)...");
          const loader = new THREE.GLTFLoader();

          loader.load(
            "./oni_mask.glb",
            (gltf) => {
              const model = gltf.scene;

              // Modeli otomatik merkezle ve boyutunu kontrol altına al
              const box = new THREE.Box3().setFromObject(model);
              const size = box.getSize(new THREE.Vector3());

              // Eğer model devasa ise (örn: 10 birimden büyükse) normalize et
              const maxDim = Math.max(size.x, size.y, size.z);
              const scaleFactor = 0.5 / (maxDim || 1); // İnsan yüzü ölçeğine sabitle

              model.scale.set(scaleFactor, scaleFactor, scaleFactor);
              model.position.set(0, -0.05, 0.05); // Yüze hafif öne oturt

              anchor.group.add(model);
              log("oni_mask.glb yüklendi ve sahneye bağlandı!", "#00ffff");
            },
            (xhr) => {
              if (xhr.lengthComputable) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                if (percent % 25 === 0) log(`Yükleniyor: %${percent}`);
              }
            },
            (error) => {
              log("MODEL YÜKLEME HATASI! Dosya açılamadı.", "#ff3333");
              console.error(error);
            },
          );

          // Yüz algılama takibi
          let wasVisible = false;
          mindarThree.renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);

            // anchor.group.visible durumu doğrudan kameranın yüzü görüp görmediğini verir
            if (anchor.group.visible && !wasVisible) {
              log("BİNGO! YÜZ KİLİTLENDİ!", "#ffff00");
              wasVisible = true;
            } else if (!anchor.group.visible && wasVisible) {
              log("Yüz görüş alanından çıktı...", "#ff5555");
              wasVisible = false;
            }
          });

          // Kamerayı ve AR'ı başlat
          await mindarThree.start();
          log("Kamera ve Yüz Algılayıcı Aktif! Yüzünüzü gösterin.");
        } catch (err) {
          log(`HATA: ${err.message}`, "#ff3333");
          console.error(err);
        }
      }

      window.addEventListener("DOMContentLoaded", initAR);
    </script>
  </body>
</html>
