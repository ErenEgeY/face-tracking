<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>AR Face Debugger</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      /* Web kamerasını sahnenin en arkasına sabitle */
      video {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        z-index: 0 !important;
        object-fit: cover !important;
        width: 100vw !important;
        height: 100vh !important;
      }
      /* 3D Canvas katmanını videonun üzerine çıkar */
      .a-canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        z-index: 10 !important;
      }
      /* Canlı Log Penceresi */
      #console-log {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 120px;
        background: rgba(0, 0, 0, 0.85);
        color: #00ff66;
        font-family: monospace;
        font-size: 12px;
        padding: 10px;
        box-sizing: border-box;
        overflow-y: scroll;
        z-index: 999999;
        border-top: 2px solid #00ff66;
      }
    </style>

    <script>
      window.logToScreen = function (msg, color = "#00ff66") {
        const box = document.getElementById("console-log");
        if (box) {
          const item = document.createElement("div");
          item.style.color = color;
          item.innerText = `> ${msg}`;
          box.appendChild(item);
          box.scrollTop = box.scrollHeight;
        }
      };
    </script>
  </head>
  <body>
    <div id="console-log">Sistem başlatılıyor...</div>

    <a-scene
      mindar-face
      embedded
      color-space="sRGB"
      renderer="alpha: true; antialias: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="oniModel" src="oni_mask.glb"></a-asset-item>
      </a-assets>

      <a-camera active="false" position="0 0 0"></a-camera>

      <!-- Sahne Işığı (Maske parlasın) -->
      <a-entity light="type: ambient; intensity: 3;"></a-entity>
      <a-entity
        light="type: directional; intensity: 2;"
        position="0 1 1"
      ></a-entity>

      <!-- HEDEF: YÜZ TAKİPÇİSİ -->
      <a-entity id="faceTarget" mindar-face-target="anchorIndex: 168">
        <!-- 1. Gözden Kaçmayacak Parlak Sarı Test Topu (Burun Üzeri) -->
        <a-sphere
          radius="0.08"
          color="#ffff00"
          position="0 -0.05 0.15"
        ></a-sphere>

        <!-- 2. ONI MASKESİ -->
        <a-gltf-model
          id="maskModel"
          src="#oniModel"
          position="0 0 0.1"
          rotation="0 0 0"
          scale="0.08 0.08 0.08"
        >
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      const scene = document.querySelector("a-scene");
      const target = document.getElementById("faceTarget");
      const mask = document.getElementById("maskModel");

      scene.addEventListener("arReady", () => {
        window.logToScreen("Kamera ve MindAR devrede.");
      });

      mask.addEventListener("model-loaded", () => {
        window.logToScreen("oni_mask.glb hazırlandı.", "#00ffff");
      });

      // Yüz tespit edildiğinde
      target.addEventListener("targetFound", () => {
        window.logToScreen("BİNGO! YÜZ YAKALANDI!", "#ffff00");
      });

      // Yüz kaybedildiğinde
      target.addEventListener("targetLost", () => {
        window.logToScreen("Yüz kayboldu...", "#ff4444");
      });
    </script>
  </body>
</html>
